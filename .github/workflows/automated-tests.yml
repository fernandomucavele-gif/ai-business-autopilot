name: Automated simulation tests

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const a=require("./npm-audit-report.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { const via=(v.via || []).map(x => typeof x === "string" ? x : x.title).join("; "); console.log(JSON.stringify({name,severity:v.severity,range:v.range,via,fixAvailable:v.fixAvailable})); } console.log("TOTAL", JSON.stringify(a.metadata?.vulnerabilities || {}));'
      - name: Run isolated tests
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
