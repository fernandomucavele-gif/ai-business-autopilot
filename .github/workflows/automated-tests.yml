name: Automated simulation tests

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies and block known vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const a=require("./npm-audit-report.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { const via=(v.via || []).map(x => typeof x === "string" ? x : x.title).join("; "); console.log(JSON.stringify({name,severity:v.severity,range:v.range,via,fixAvailable:v.fixAvailable})); } const total=a.metadata?.vulnerabilities || {}; console.log("TOTAL", JSON.stringify(total)); if ((total.total || 0) > 0) process.exit(1);'
      - name: Run isolated tests
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js with dummy Supabase configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key-not-valid-for-any-project
        run: npm run build
