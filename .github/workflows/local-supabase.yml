name: Local Supabase infrastructure

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/local-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Apply and validate local schema migrations
        run: |
          supabase db reset --local
          supabase migration list --local

      - name: Verify local services
        run: supabase status

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
